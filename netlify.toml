[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/visitor-notification"
  to = "/.netlify/functions/visitor-notification"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
